# Builds web/ (the hangarplatform.dev site) and deploys it to GitHub Pages.
# One-time setup: Settings > Pages > Source: GitHub Actions; then set the custom domain there.
name: Site

on:
  push:
    branches: [main]
    paths:
      - web/**
      - docs/autopilot/diagrams/**
      - docs/brand/**
      - brand/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - web/**
      - docs/autopilot/diagrams/**
      - docs/brand/**
      - brand/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Empty on a pull request, where the defaults (hangarplatform.dev at /) apply.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
