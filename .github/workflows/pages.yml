# Builds web/ (the hangarplatform.dev site) and deploys it to GitHub Pages.
# One-time setup: Settings > Pages > Source: GitHub Actions; then set the custom domain there.
# The Docs section pulls each product's docs from its own repo at build time, so a nightly
# run picks up doc changes made in those repos.
name: Site

on:
  push:
    branches: [main]
    paths:
      - web/**
      - docs/**
      - brand/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - web/**
      - docs/**
      - brand/**
      - .github/workflows/pages.yml
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The other product repos, for the Docs section (all public, so no token is needed).
      - uses: actions/checkout@v7
        with: { repository: jfillman/glidepath, path: _docs/glidepath }
      - uses: actions/checkout@v7
        with: { repository: jfillman/airframe, path: _docs/airframe }
      - uses: actions/checkout@v7
        with: { repository: jfillman/tower, path: _docs/tower }
      - uses: actions/checkout@v7
        with: { repository: jfillman/autopilot, path: _docs/autopilot }
      - uses: actions/checkout@v7
        with: { repository: jfillman/apron, path: _docs/apron }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Empty on a pull request, where the defaults (hangarplatform.dev at /) apply.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          DOCS_REPOS_DIR: ${{ github.workspace }}/_docs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
          # web/public/oidc/<cluster>/.well-known/openid-configuration is a ServiceAccount issuer's discovery
          # document; AWS STS and other clusters' API servers fetch it. v4+ drops dotfiles unless told otherwise.
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
        with:
          sparse-checkout: web/public/oidc
      # Every published issuer must serve a discovery document naming itself, or the clusters and AWS roles
      # that trust it start refusing its tokens (web/public/oidc/README.md).
      - name: Check the published ServiceAccount issuers
        run: |
          set -euo pipefail
          for dir in web/public/oidc/*/; do
            issuer="https://hangarplatform.dev/oidc/$(basename "$dir")"
            for attempt in $(seq 1 12); do
              got=$(curl -fsS "$issuer/.well-known/openid-configuration" | jq -r .issuer) && [ "$got" = "$issuer" ] \
                && curl -fsS "$issuer/jwks.json" | jq -e '.keys | length > 0' >/dev/null && break
              [ "$attempt" = 12 ] && { echo "::error::$issuer is not serving its discovery document and keys"; exit 1; }
              sleep 10
            done
            echo "ok $issuer"
          done
